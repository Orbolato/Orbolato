name: Add masters dissertation to homepage

on:
  push:
    branches: ["fix/masters-dissertation-homepage"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/masters-dissertation-homepage
      - name: Add dissertation section and navigation link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_nav = '<a href="#geotechnics">Earlier ML work</a><a href="#citation">Citation guidance</a>'
          new_nav = '<a href="#geotechnics">Earlier ML work</a><a href="#theses">Theses & dissertations</a><a href="#citation">Citation guidance</a>'
          if text.count(old_nav) != 1:
              raise SystemExit("Expected homepage navigation anchor not found exactly once")
          text = text.replace(old_nav, new_nav, 1)

          marker = '</section>\n<section class="section" id="citation">'
          section = '''</section>
          <section class="section" id="theses"><h2>Theses and dissertations</h2>
          <article class="paper"><h3><a href="/publications/masters-dissertation-soil-classification/">Application of Machine Learning Techniques for Soil Classification from CPTU</a></h3><div class="meta">Lucas Orbolato Carvalho. Master's dissertation, Aeronautics Institute of Technology (ITA), 2018. Advisor: Dimas Betioli Ribeiro.</div><p>Master's research on supervised and unsupervised machine-learning methods for soil classification from CPTU, connecting the early KNN/DWKNN, ANN/SVM, tree-based, multiple-model, and kernel-clustering research line.</p><div class="tags">CPTU | soil classification | machine learning | clustering | master's dissertation</div><p><a href="/publications/masters-dissertation-soil-classification/">Dissertation page</a> | <a href="/publications/masters-dissertation-soil-classification/masters_thesis_final_signed.pdf" target="_blank" rel="noopener noreferrer">Signed PDF</a></p></article>
          </section>
          <section class="section" id="citation">'''
          if text.count(marker) != 1:
              raise SystemExit("Expected citation-section marker not found exactly once")
          text = text.replace(marker, section, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add master's dissertation to homepage"
          git push origin HEAD:fix/masters-dissertation-homepage
