name: Fix publications hero link

on:
  push:
    branches:
      - fix/publications-hero-link

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publications-hero-link
      - name: Point Publications to dedicated index
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<div class="links"><a href="#publications">Publications</a>'
          new = '<div class="links"><a href="/publications/">Publications</a>'
          if text.count(old) != 1:
              raise SystemExit("Expected hero Publications link not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Point Publications hero link to publications index"
          git push origin HEAD:fix/publications-hero-link
