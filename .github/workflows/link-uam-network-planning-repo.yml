name: link-uam-network-planning-repo

on:
  push:
    branches: [content/link-uam-network-planning-repo]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/link-uam-network-planning-repo
          fetch-depth: 0

      - name: Patch website links and metadata
        shell: python
        run: |
          from pathlib import Path

          repo = "https://github.com/Orbolato/UAM-Network-Planning-Sao-Paulo"

          replacements = {
              "index.html": [
                  (
                      '<a href="https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil" target="_blank" rel="noopener noreferrer">ResearchGate</a></p></article>',
                      '<a href="https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil" target="_blank" rel="noopener noreferrer">ResearchGate</a> | <a href="' + repo + '" target="_blank" rel="noopener noreferrer">GitHub repository</a></p></article>'
                  )
              ],
              "publications/index.html": [
                  (
                      'Case Studies on Transport Policy · 2026 · DOI 10.1016/j.cstp.2026.101848</div></div>',
                      'Case Studies on Transport Policy · 2026 · DOI 10.1016/j.cstp.2026.101848 · <a href="' + repo + '" target="_blank" rel="noopener noreferrer">Code & reproducibility</a></div></div>'
                  )
              ],
              "publications/uam-network-planning/index.html": [
                  (
                      '"identifier":"https://doi.org/10.1016/j.cstp.2026.101848","sameAs":["https://doi.org/10.1016/j.cstp.2026.101848","https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil"]',
                      '"identifier":"https://doi.org/10.1016/j.cstp.2026.101848","codeRepository":"' + repo + '","sameAs":["https://doi.org/10.1016/j.cstp.2026.101848","https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil","' + repo + '"]'
                  ),
                  (
                      '<a class="btn" href="https://doi.org/10.1016/j.cstp.2026.101848">Publisher / DOI</a><a class="btn" href="https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil">ResearchGate</a>',
                      '<a class="btn" href="https://doi.org/10.1016/j.cstp.2026.101848">Publisher / DOI</a><a class="btn" href="' + repo + '">Code & reproducibility</a><a class="btn" href="https://www.researchgate.net/publication/404894039_Data-driven_framework_for_urban_air_mobility_planning_Integrating_socioeconomic_and_operational_factors_for_optimal_network_design_in_Sao_Paulo_Brazil">ResearchGate</a>'
                  )
              ],
          }

          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      count = text.count(old)
                      if count != 1:
                          raise RuntimeError(f"Expected one match in {filename}, found {count}")
                      text = text.replace(old, new)
                      changed = True
                  elif new not in text:
                      raise RuntimeError(f"Expected source snippet not found in {filename}")
              path.write_text(text, encoding="utf-8")

          print("Website changes applied." if changed else "Website already up to date.")

      - name: Validate diff
        run: git diff --check

      - name: Commit website synchronization
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Lucas Orbolato Carvalho"
          git config user.email "40774995+Orbolato@users.noreply.github.com"
          git add index.html publications/index.html publications/uam-network-planning/index.html
          git commit -m "Link UAM network-planning repository"
          git push origin HEAD:content/link-uam-network-planning-repo
