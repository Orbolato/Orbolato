name: Update publication repository links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-publication-repo-links.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update MDPI and BNN repository links
        shell: python
        run: |
          from pathlib import Path

          homepage = Path('index.html')
          bnn_page = Path('publications/bnn-flight-delay/index.html')

          home = homepage.read_text(encoding='utf-8')
          bnn = bnn_page.read_text(encoding='utf-8')

          old_bnn_url = 'https://github.com/Orbolato/BNN-Flight-Delay-Reproducibility'
          new_bnn_url = 'https://github.com/Orbolato/BNN-Flight-Delay-Prediction'
          mdpi_supp = '<a href="https://www.mdpi.com/article/10.3390/sci8070169/s1" target="_blank" rel="noopener noreferrer">Supplementary material / code</a>'
          mdpi_repo = '<a href="https://github.com/Orbolato/Aeromedical-Ground-Time-Analysis" target="_blank" rel="noopener noreferrer">GitHub repository</a>'

          # Guardrails: fail if the expected current content is not present.
          if old_bnn_url not in home:
              raise SystemExit('Expected old BNN URL not found in homepage')
          if old_bnn_url not in bnn:
              raise SystemExit('Expected old BNN URL not found in BNN landing page')
          if mdpi_supp not in home:
              raise SystemExit('Expected MDPI supplementary link not found in homepage')
          if 'Aeromedical-Ground-Time-Analysis' in home:
              raise SystemExit('Aeromedical repository link already present in homepage')

          home = home.replace(old_bnn_url, new_bnn_url)
          home = home.replace('>Code &amp; reproducibility</a>', '>Code repository</a>')
          home = home.replace(mdpi_supp, mdpi_supp + ' | ' + mdpi_repo, 1)

          bnn = bnn.replace(old_bnn_url, new_bnn_url)
          bnn = bnn.replace('>Code &amp; reproducibility</a>', '>Code repository</a>')
          bnn = bnn.replace('>github.com/Orbolato/BNN-Flight-Delay-Reproducibility</a>', '>github.com/Orbolato/BNN-Flight-Delay-Prediction</a>')

          homepage.write_text(home, encoding='utf-8')
          bnn_page.write_text(bnn, encoding='utf-8')

      - name: Remove one-time workflow
        run: git rm .github/workflows/update-publication-repo-links.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications/bnn-flight-delay/index.html
          git commit -m "Update publication code repository links [skip ci]"
          git push
