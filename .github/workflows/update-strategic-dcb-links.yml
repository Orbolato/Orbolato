name: update-strategic-dcb-links

on:
  push:
    branches: [maintenance/update-strategic-dcb-links]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/update-strategic-dcb-links
          fetch-depth: 0

      - name: Update DASC project and repository references
        shell: python
        run: |
          from pathlib import Path

          old_slug = "dasc2026-paper-276"
          new_slug = "Strategic-DCB-RL"
          repo_url = "https://github.com/Orbolato/Strategic-DCB-RL"
          page_url = "https://orbolato.github.io/Strategic-DCB-RL/"

          # Homepage: update the project URL and expose the renamed GitHub repository.
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(f'href="/{old_slug}/"', f'href="/{new_slug}/"')
          text = text.replace(f"https://orbolato.github.io/{old_slug}/", page_url)
          marker = f'<a href="{page_url}poster.pdf" target="_blank" rel="noopener noreferrer">Poster</a></p>'
          replacement = marker[:-4] + f' | <a href="{repo_url}" target="_blank" rel="noopener noreferrer">GitHub repository</a></p>'
          if marker not in text:
              raise RuntimeError("Homepage DASC poster marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")

          # Publications index: update the project route and add the standard GitHub repository link.
          path = Path("publications/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(f'href="/{old_slug}/"', f'href="/{new_slug}/"')
          meta = '<div class="meta">45th Digital Avionics Systems Conference · 2026 · Student Research Competition finalist</div>'
          meta_new = f'<div class="meta">45th Digital Avionics Systems Conference · 2026 · Student Research Competition finalist · <a href="{repo_url}" target="_blank" rel="noopener noreferrer">GitHub repository</a></div>'
          if meta not in text:
              raise RuntimeError("Publications-index DASC metadata marker not found")
          text = text.replace(meta, meta_new, 1)
          path.write_text(text, encoding="utf-8")

          # Main sitemap: point at the renamed GitHub Pages project.
          path = Path("sitemap.xml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(f"https://orbolato.github.io/{old_slug}/", page_url)
          text = text.replace(f'<url><loc>{page_url}</loc><lastmod>2026-10-11</lastmod>', f'<url><loc>{page_url}</loc><lastmod>2026-10-13</lastmod>')
          path.write_text(text, encoding="utf-8")

          for check_path in [Path("index.html"), Path("publications/index.html"), Path("sitemap.xml")]:
              if old_slug in check_path.read_text(encoding="utf-8"):
                  raise RuntimeError(f"Legacy DASC slug remains in {check_path}")

      - name: Validate diff
        run: git diff --check

      - name: Commit updated links
        run: |
          git config user.name "Lucas Orbolato Carvalho"
          git config user.email "40774995+Orbolato@users.noreply.github.com"
          git add index.html publications/index.html sitemap.xml
          git commit -m "Update Strategic DCB repository references"
          git push origin HEAD:maintenance/update-strategic-dcb-links
