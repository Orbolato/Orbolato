name: Add JATM repository link to homepage

on:
  push:
    branches:
      - fix/jatm-homepage-repo-link

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jatm-homepage-repo-link
      - name: Add JATM repository link
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<div class="tags">runway configuration | machine learning | forecasting | airport operations | decision support | SBGR</div></article>'
          new = '<div class="tags">runway configuration | machine learning | forecasting | airport operations | decision support | SBGR</div><p><a href="https://github.com/Orbolato/SBGR-Runway-Configuration-Forecasts" target="_blank" rel="noopener noreferrer">GitHub repository</a></p></article>'
          if text.count(old) != 1:
              raise SystemExit("Expected JATM homepage entry not found exactly once")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add JATM repository link to homepage"
          git push origin HEAD:fix/jatm-homepage-repo-link
